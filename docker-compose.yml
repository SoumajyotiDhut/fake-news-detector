version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fakenews-backend
    volumes:
      - ./data:/app/data
    environment:
      - MODEL_DIR=/app/models
      - DB_PATH=/app/data/predictions.db
      - PYTHONPATH=/app/api:/app/models
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fakenews-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped